<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            width: 380px;
            background: white;

            padding: 35px;

            border-radius: 12px;

            box-shadow:
                0 8px 25px rgba(0, 0, 0, 0.08);
        }

        h1 {
            text-align: center;
            margin: 0 0 10px;
            color: #20283a;
        }

        .subtitle {
            text-align: center;
            color: #667085;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 13px;

            margin-bottom: 18px;

            border: 1px solid #d0d5dd;
            border-radius: 7px;

            font-size: 15px;
        }

        button {
            width: 100%;

            padding: 13px;

            border: none;
            border-radius: 7px;

            background: #6d00e8;
            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            background: #5700ba;
        }

        #message {
            display: none;

            margin-bottom: 18px;

            padding: 12px;

            border-radius: 6px;
        }

        .error {
            display: block !important;

            background: #fee2e2;
            color: #b91c1c;
        }
    </style>
</head>

<body>

<div class="login-box">

    <h1>Admin Login</h1>

    <div class="subtitle">
        Traffic Congestion Analyzer
    </div>

    <div id="message"></div>

    <form id="adminLoginForm">

        <label>Email</label>

        <input
            type="email"
            id="email"
            placeholder="Admin email"
            required
        >

        <label>Password</label>

        <input
            type="password"
            id="password"
            placeholder="Password"
            required
        >

        <button type="submit">
            Admin Login
        </button>

    </form>

</div>

<script>

document
    .getElementById("adminLoginForm")
    .addEventListener("submit", async function(event) {

        event.preventDefault();

        const email =
            document.getElementById("email").value.trim();

        const password =
            document.getElementById("password").value;

        const message =
            document.getElementById("message");

        try {

            const response =
                await fetch("/login", {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        email: email,
                        password: password
                    })
                });

            const data =
                await response.json();

            console.log("Login response:", data);

            if (!response.ok) {

                throw new Error(
                    data.error ||
                    "Login failed."
                );
            }

            /*
             * IMPORTANT:
             * Only an ADMIN account can use
             * the admin dashboard.
             */

            if (
                !data.user ||
                data.user.role !== "ADMIN"
            ) {

                throw new Error(
                    "This account is not an admin account."
                );
            }

            /*
             * Save login information
             */

            localStorage.setItem(
                "token",
                data.token
            );

            localStorage.setItem(
                "user",
                JSON.stringify(data.user)
            );

            console.log(
                "Admin logged in:",
                data.user
            );

            /*
             * Go to admin dashboard
             */

            window.location.href =
                "/admin.html";

        } catch (error) {

            console.error(
                "Admin login error:",
                error
            );

            message.textContent =
                error.message;

            message.className =
                "error";
        }

    });

</script>

</body>
</html>
