<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Dashboard</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;

            font-family: Arial, sans-serif;

            background: #f4f6f8;
        }

        header {
            background: #20283a;

            color: white;

            padding: 20px 35px;

            display: flex;

            justify-content: space-between;

            align-items: center;
        }

        header h1 {
            margin: 0;

            font-size: 22px;
        }

        .logout {
            background: #dc2626;

            color: white;

            border: none;

            padding: 9px 15px;

            border-radius: 6px;

            cursor: pointer;
        }

        .container {
            max-width: 700px;

            margin: 50px auto;

            padding: 0 20px;
        }

        .card {
            background: white;

            padding: 30px;

            border-radius: 12px;

            box-shadow:
                0 6px 20px rgba(0, 0, 0, 0.08);
        }

        h2 {
            margin-top: 0;

            color: #20283a;
        }

        .admin-name {
            color: #667085;

            margin-bottom: 25px;
        }

        label {
            display: block;

            margin-top: 18px;

            margin-bottom: 7px;

            font-weight: 600;
        }

        input,
        select {
            width: 100%;

            padding: 13px;

            border: 1px solid #d0d5dd;

            border-radius: 7px;

            font-size: 15px;
        }

        button[type="submit"] {

            width: 100%;

            margin-top: 25px;

            padding: 14px;

            border: none;

            border-radius: 7px;

            background: #6d00e8;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }

        button[type="submit"]:disabled {
            opacity: 0.6;

            cursor: not-allowed;
        }

        #message {

            display: none;

            margin-top: 20px;

            padding: 12px;

            border-radius: 7px;
        }

        .success {

            display: block !important;

            background: #dcfce7;

            color: #166534;
        }

        .error {

            display: block !important;

            background: #fee2e2;

            color: #b91c1c;
        }

    </style>

</head>

<body>

<header>

    <h1>
        Traffic Congestion Analyzer — Admin
    </h1>

    <button
        class="logout"
        onclick="logout()"
    >
        Logout
    </button>

</header>


<div class="container">

    <div class="card">

        <h2>
            Add Admin Observation
        </h2>

        <div
            class="admin-name"
            id="adminName"
        ></div>

        <form id="adminObservationForm">

            <label for="road">
                Road
            </label>

            <input
                type="text"
                id="road"
                placeholder="Example: NH44"
                required
            >


            <label for="date">
                Date
            </label>

            <input
                type="date"
                id="date"
                required
            >


            <label for="time">
                Time
            </label>

            <input
                type="time"
                id="time"
                required
            >


            <label for="observation">
                Observation
            </label>

            <select
                id="observation"
                required
            >

                <option value="">
                    Select observation
                </option>

                <option value="Normal traffic">
                    Normal traffic
                </option>

                <option value="Heavy traffic">
                    Heavy traffic
                </option>

                <option value="Slow moving traffic">
                    Slow moving traffic
                </option>

                <option value="Road blockage">
                    Road blockage
                </option>

                <option value="Traffic accident">
                    Traffic accident
                </option>

                <option value="Road construction">
                    Road construction
                </option>

                <option value="Weather related traffic">
                    Weather related traffic
                </option>

                <option value="Other">
                    Other
                </option>

            </select>


            <button
                type="submit"
                id="submitButton"
            >
                Submit Admin Observation
            </button>

        </form>


        <div id="message"></div>

    </div>

</div>


<script>

/*
 * ================================
 * CHECK ADMIN LOGIN
 * ================================
 */

const token =
    localStorage.getItem("token");

const storedUser =
    localStorage.getItem("user");


if (!token || !storedUser) {

    window.location.href =
        "/admin-login.html";

}


let user;

try {

    user =
        JSON.parse(storedUser);

} catch (error) {

    localStorage.clear();

    window.location.href =
        "/admin-login.html";
}


/*
 * Make sure this is actually ADMIN
 */

if (!user || user.role !== "ADMIN") {

    localStorage.clear();

    window.location.href =
        "/admin-login.html";

}


/*
 * Show admin name
 */

document.getElementById(
    "adminName"
).textContent =
    "Logged in as: " +
    user.name;


/*
 * ================================
 * SUBMIT ADMIN OBSERVATION
 * ================================
 */

document
    .getElementById("adminObservationForm")
    .addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();

            const button =
                document.getElementById(
                    "submitButton"
                );

            const message =
                document.getElementById(
                    "message"
                );


            const road =
                document.getElementById(
                    "road"
                ).value.trim();

            const date =
                document.getElementById(
                    "date"
                ).value;

            const time =
                document.getElementById(
                    "time"
                ).value;

            const observation =
                document.getElementById(
                    "observation"
                ).value;


            button.disabled = true;

            button.textContent =
                "Submitting...";


            try {

                const response =
                    await fetch(
                        "/api/admin/observation",
                        {

                            method: "POST",

                            headers: {

                                "Content-Type":
                                    "application/json",

                                "Authorization":
                                    "Bearer " +
                                    token

                            },

                            body:
                                JSON.stringify({

                                    road:
                                        road,

                                    recorded_date:
                                        date,

                                    recorded_time:
                                        time,

                                    observation:
                                        observation

                                })

                        }
                    );


                const data =
                    await response.json();


                console.log(
                    "Admin observation response:",
                    data
                );


                if (!response.ok) {

                    throw new Error(
                        data.error ||
                        "Unable to submit observation."
                    );

                }


                message.textContent =
                    "Admin observation submitted successfully.";

                message.className =
                    "success";


                document
                    .getElementById(
                        "adminObservationForm"
                    )
                    .reset();


            } catch (error) {

                console.error(
                    "Admin observation error:",
                    error
                );

                message.textContent =
                    error.message;

                message.className =
                    "error";

            } finally {

                button.disabled =
                    false;

                button.textContent =
                    "Submit Admin Observation";

            }

        }
    );


/*
 * ================================
 * LOGOUT
 * ================================
 */

function logout() {

    localStorage.removeItem("token");

    localStorage.removeItem("user");

    window.location.href =
        "/admin-login.html";
}

</script>

</body>

</html>
